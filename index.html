        <!-- Module & Mode Selection Controls -->

            <div class="grid grid-cols-2 gap-2">

                <button onclick="loadWeakSpots()"

        <!-- Series Grid Selector -->

        <!-- Series Grid Selector & History Dashboard Container -->
        <div id="series-container" class="bg-white p-4 rounded-xl shadow-sm space-y-6">
            <!-- Top: Series Grid -->
            <div>
                <h2 id="series-grid-title" class="text-sm font-semibold mb-3">Select Series</h2>
                <div id="series-grid" class="grid grid-cols-5 gap-2"></div>
            </div>

            <!-- Bottom: Test History Section -->
            <div class="border-t pt-4 border-gray-100">
                <h2 class="text-sm font-semibold mb-3 text-gray-800 flex justify-between items-center">
                    <span>Test History</span>
                    <span id="history-module-badge"
                        class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-bold">Écrite</span>
                </h2>
                <div id="history-list" class="space-y-2 max-h-80 overflow-y-auto pr-1 text-xs">
                    <p class="text-gray-400 italic text-center py-4">Loading history...</p>

        <!-- Active Question Card -->
        <div id="quiz-container" class="hidden space-y-4">
            <div
                class="flex justify-between items-center bg-white px-4 py-2 rounded-xl shadow-sm text-xs font-semibold">
                <span id="progress-text" class="text-gray-500">Question 1 / 39</span>
                <span id="score-text" class="text-blue-600">Points: 0 / 0</span>
            </div>

            <div id="question-card" class="bg-white p-4 rounded-xl shadow-sm space-y-3">

                <div id="audio-container" class="hidden">
                    <audio id="q-audio" controls class="w-full mt-2"></audio>

                <div class="flex justify-between items-start">
                    <p id="q-text" class="font-medium text-sm text-gray-900"></p>
                    <span id="q-points-badge"
                        class="ml-2 bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0"></span>
                </div>

                <div id="options-container" class="space-y-2 pt-1"></div>

                <!-- Action Button -->
                <button id="action-btn" onclick="submitAnswer()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold shadow text-sm">
                    Submit Answer
                </button>

                <!-- Feedback Banner MOVED HERE (Under the Submit Button) -->
                <div id="feedback-banner" class="hidden p-3 rounded-lg text-xs font-bold text-center"></div>
            </div>

    <script>
        // =================================-------------------------
        // 1. SUPABASE CONFIGURATION
        // =================================-------------------------
        const SUPABASE_URL = "https://cheyvjepgywypvzzkoio.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EgZFYyBbZSKJoFR2K02FYg_7nzSub4v";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let database = { ecrit: [], orale: [] };
        let currentModule = 'ecrit';
        let activeQuestions = [];
        let currentIndex = 0;
        let currentEarnedPoints = 0;
        let currentTotalPossiblePoints = 0;
        let currentRawCorrect = 0;

        const JSON_PATHS = {
            ecrit: './questions.json',
            orale: './listening.json'
        };

        // TEF/TCF Points Breakdown Helper
        function getQuestionPoints(qNumber) {
            const num = parseInt(qNumber, 10);
            if (num >= 1 && num <= 4) return 3;
            if (num >= 5 && num <= 10) return 9;
            if (num >= 11 && num <= 19) return 15;
            if (num >= 20 && num <= 29) return 21;
            if (num >= 30 && num <= 35) return 26;
            if (num >= 36 && num <= 39) return 33;
            return 15; // Default fallback point
        }
        // =================================-------------------------
        // NCLC / CLB MAPPING LOGIC (Based on Official Benchmark Grid)
        // =================================-------------------------
        function getCLBLevel(score, moduleType) {
            const isReading = (moduleType === 'ecrit');

            if (isReading) {
                if (score >= 549) return { clb: 10, cefr: "C1-C2" };
                if (score >= 524) return { clb: 9, cefr: "C1" };
                if (score >= 499) return { clb: 8, cefr: "B2" };
                if (score >= 453) return { clb: 7, cefr: "B2" };
                if (score >= 406) return { clb: 6, cefr: "B1" };
                if (score >= 375) return { clb: 5, cefr: "B1" };
                if (score >= 342) return { clb: 4, cefr: "A2" };
                return { clb: "<4", cefr: "A1-A2" };
            } else { // Listening
                if (score >= 549) return { clb: 10, cefr: "C1-C2" };
                if (score >= 523) return { clb: 9, cefr: "C1" };
                if (score >= 503) return { clb: 8, cefr: "B2" };
                if (score >= 458) return { clb: 7, cefr: "B2" };
                if (score >= 398) return { clb: 6, cefr: "B1" };
                if (score >= 369) return { clb: 5, cefr: "B1" };
                if (score >= 331) return { clb: 4, cefr: "A2" };
                return { clb: "<4", cefr: "A1-A2" };
            }
        }

        // Save Completed Test Result to Supabase
        async function saveTestResult(seriesNum, score) {
            const { clb, cefr } = getCLBLevel(score, currentModule);

            await _supabase.from('test_results').insert([{
                module: currentModule,
                series_number: seriesNum,
                score: score,
                clb_level: typeof clb === 'number' ? clb : 0,
                cefr_level: cefr
            }]);

            loadTestHistory(); // Refresh Sidebar
        }

        // Fetch & Render Test History List
        async function loadTestHistory() {
            const historyList = document.getElementById('history-list');
            document.getElementById('history-module-badge').innerText = currentModule === 'ecrit' ? 'Écrite' : 'Orale';

            const { data: results, error } = await _supabase
                .from('test_results')
                .select('*')
                .eq('module', currentModule)
                .order('created_at', { ascending: false });

            if (error || !results || results.length === 0) {
                historyList.innerHTML = `<p class="text-gray-400 italic text-center py-4">No completed tests yet for ${currentModule === 'ecrit' ? 'Écrite' : 'Orale'}.</p>`;
                return;
            }

            historyList.innerHTML = '';
            results.forEach(res => {
                const dateStr = new Date(res.created_at).toLocaleDateString('fr-FR', { month: 'short', day: 'numeric' });
                const clbInfo = getCLBLevel(res.score, res.module);

                const card = document.createElement('div');
                card.className = "flex justify-between items-center p-2.5 bg-gray-50 border border-gray-200 rounded-lg";
                card.innerHTML = `
                    <div>
                        <p class="font-bold text-gray-800">Série ${res.series_number}</p>
                        <p class="text-[10px] text-gray-500">${dateStr}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-extrabold text-blue-600">${res.score} pts</p>
                        <span class="text-[10px] bg-purple-100 text-purple-800 font-bold px-1.5 py-0.5 rounded">
                            CLB ${clbInfo.clb} (${clbInfo.cefr})
                        </span>
                    </div>
                `;
                historyList.appendChild(card);
            });
        }
        // =================================-------------------------
        // 2. FETCH JSON & MAP QUESTIONS (39 PER SERIES)
        // =================================-------------------------
        async function loadJSONData(moduleType) {
            const filePath = JSON_PATHS[moduleType];
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Could not load ${filePath}`);

                const data = await response.json();
                const rawArray = data.questions || data;

                database[moduleType] = rawArray.map((q, index) => {
                    const seriesIndex = Math.floor(index / 39) + 1;
                    const posInSeries = (index % 39) + 1;
                    return {
                        id: `${moduleType.charAt(0).toUpperCase()}_${q.number || (index + 1)}`,
                        series: seriesIndex,
                        posInSeries: posInSeries,
                        points: getQuestionPoints(posInSeries),
                        info: q.info || "",
                        audio: q.audio || null,
                        question: q.question,
                        options: q.options,
                        answer: q.answer
                    };
                });

                console.log(`Loaded ${database[moduleType].length} questions for ${moduleType}.`);
                renderSeriesSelector();
            } catch (error) {
                console.error("Error loading JSON:", error);
                document.getElementById('series-grid').innerHTML = `
                    <div class="col-span-5 text-red-500 text-xs text-center p-4">
                        <b>File Load Error:</b><br>${error.message}
                    </div>
                `;
            }
        }

        // =================================-------------------------
        // 3. CLOUD SYNC FUNCTIONS (SUPABASE)
        // =================================-------------------------
        async function saveAttemptToCloud(questionId, isCorrect) {
            console.log(`Saving attempt -> ID: ${questionId}, Module: ${currentModule}, Correct: ${isCorrect}`);
            const { data, error } = await _supabase.from('attempts').insert([{
                question_id: questionId,
                module: currentModule,
                is_correct: isCorrect
            }]);

            if (error) {
                console.error("Supabase Save Error:", error);
            } else {
                console.log("Supabase Save Success:", data);
            }
        }

        async function loadWeakSpots() {
            console.log(`Fetching weak spots for module: ${currentModule}`);

            const { data: attempts, error } = await _supabase
                .from('attempts')
                .select('question_id, is_correct')
                .eq('module', currentModule);

            if (error) {
                console.error("Supabase Query Error:", error);
                alert("Error fetching data from Supabase. Check browser console.");
                return;
            }

            console.log("Raw cloud attempts received:", attempts);

            if (!attempts || attempts.length === 0) {
                alert("No performance history found in Supabase! Answer some questions first.");
                return;
            }

            // Aggregate attempts per question
            const stats = {};
            attempts.forEach(a => {
                if (!stats[a.question_id]) stats[a.question_id] = { total: 0, wrong: 0 };
                stats[a.question_id].total += 1;
                if (!a.is_correct) stats[a.question_id].wrong += 1;
            });

            console.log("Aggregated Stats:", stats);

            // Filter questions with >= 50% error rate
            // Filter questions with >= 50% error rate
            const moduleQuestions = database[currentModule] || [];
            const rawWeakSpots = moduleQuestions.filter(q => {
                const s = stats[q.id];
                return s && s.total >= 1 && (s.wrong / s.total) >= 0.5;
            });

            // Deduplicate weak spot questions based on unique question text
            const seenTexts = new Set();
            activeQuestions = rawWeakSpots.filter(q => {
                // Normalize question text to catch exact text duplicates across series
                const cleanText = q.question.trim().toLowerCase();
                if (seenTexts.has(cleanText)) {
                    return false; // Skip if we've already added this exact question text
                }
                seenTexts.add(cleanText);
                return true;
            });

            console.log("Matched Weak Spot Questions:", activeQuestions);

            if (activeQuestions.length === 0) {
                alert("No weak spots identified! All answered questions have >50% accuracy.");
                return;
            }

            startQuiz();
        }

        async function resetStats() {
            if (confirm("Are you sure you want to clear your entire cloud performance history?")) {
                const { error } = await _supabase.from('attempts').delete().eq('module', currentModule);
                if (error) {
                    console.error("Reset Error:", error);
                    alert("Could not reset stats: " + error.message);
                } else {
                    alert("Cloud history reset!");
                }
            }
        }

        // =================================-------------------------
        // 4. NAVIGATION & RENDERING CONTROLS
        // =================================-------------------------
        function switchModule(moduleType) {
            currentModule = moduleType;

            const btnEcrit = document.getElementById('mod-ecrit');
            const btnOrale = document.getElementById('mod-orale');

            if (moduleType === 'ecrit') {
                btnEcrit.className = "flex-1 py-1.5 text-xs font-bold rounded-md bg-blue-600 text-white shadow-sm";
                btnOrale.className = "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900";
            } else {
                btnOrale.className = "flex-1 py-1.5 text-xs font-bold rounded-md bg-blue-600 text-white shadow-sm";
                btnEcrit.className = "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-600 hover:text-gray-900";
            }

            if (database[currentModule].length === 0) {
                loadJSONData(currentModule);
            } else {
                renderSeriesSelector();
            }
        }

        function renderSeriesSelector() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('series-container').classList.remove('hidden');

            const title = document.getElementById('series-grid-title');
            title.innerText = `Select ${currentModule === 'ecrit' ? 'Compréhension Écrite' : 'Compréhension Orale'} Series`;

            const grid = document.getElementById('series-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= 40; i++) {
                const btn = document.createElement('button');
                btn.className = "bg-blue-50 text-blue-600 font-bold p-3 rounded-lg text-center hover:bg-blue-600 hover:text-white border border-blue-200 transition text-sm";
                btn.innerText = i;
                btn.onclick = () => loadSeries(i);
                grid.appendChild(btn);
            }
            loadTestHistory(); // <-- Reload history on dashboard load

        }

        function loadSeries(seriesNum) {
            const moduleQuestions = database[currentModule] || [];
            activeQuestions = moduleQuestions.filter(q => q.series === seriesNum);

            if (activeQuestions.length === 0) {
                alert(`No questions found in Series ${seriesNum} for this module.`);
                return;
            }

            startQuiz();
        }

        function startQuiz() {
            currentIndex = 0;
            currentEarnedPoints = 0;
            currentRawCorrect = 0;

            // Calculate total possible weighted points for active set
            currentTotalPossiblePoints = activeQuestions.reduce((sum, q) => sum + q.points, 0);

            document.getElementById('series-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            const q = activeQuestions[currentIndex];

            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} / ${activeQuestions.length}`;
            document.getElementById('score-text').innerText = `Points: ${currentEarnedPoints} / ${currentTotalPossiblePoints} pts`;

            const infoElem = document.getElementById('q-info');
            if (q.info) {
                infoElem.innerText = q.info;
                infoElem.classList.remove('hidden');
            } else {
                infoElem.classList.add('hidden');
            }

            const audioContainer = document.getElementById('audio-container');
            const audioElem = document.getElementById('q-audio');
            if (q.audio) {
                audioElem.src = q.audio;
                audioContainer.classList.remove('hidden');
            } else {
                audioContainer.classList.add('hidden');
            }

            document.getElementById('q-text').innerText = q.question;
            document.getElementById('q-points-badge').innerText = `+${q.points} pt`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            ['A', 'B', 'C', 'D'].forEach(optKey => {
                if (q.options && q.options[optKey]) {
                    const label = document.createElement('label');
                    label.id = `opt-label-${optKey}`;
                    label.className = "flex items-center space-x-3 text-xs p-3 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 cursor-pointer transition";
                    label.innerHTML = `
                        <input type="radio" name="option" value="${optKey}" class="text-blue-600 focus:ring-0">
                        <span id="opt-text-${optKey}"><b>${optKey}:</b> ${q.options[optKey]}</span>
                    `;
                    optionsContainer.appendChild(label);
                }
            });

            const feedback = document.getElementById('feedback-banner');
            feedback.className = "hidden p-3 rounded-lg text-xs font-bold text-center";

            const btn = document.getElementById('action-btn');
            btn.innerText = "Submit Answer";
            btn.onclick = submitAnswer;
        }

        async function submitAnswer() {
            const selectedOpt = document.querySelector('input[name="option"]:checked');
            if (!selectedOpt) {
                alert("Please select an answer first!");
                return;
            }

            const q = activeQuestions[currentIndex];
            const userAns = selectedOpt.value;
            const isCorrect = (userAns === q.answer);

            // Save Attempt to Supabase
            saveAttemptToCloud(q.id, isCorrect);

            ['A', 'B', 'C', 'D'].forEach(key => {
                const label = document.getElementById(`opt-label-${key}`);
                if (!label) return;

                const radio = label.querySelector('input');
                radio.disabled = true;

                if (key === q.answer) {
                    label.className = "flex items-center space-x-3 text-xs p-3 rounded-lg border-2 border-green-500 bg-green-50 text-green-900 font-semibold";
                } else if (key === userAns && !isCorrect) {
                    label.className = "flex items-center space-x-3 text-xs p-3 rounded-lg border-2 border-red-500 bg-red-50 text-red-900 font-semibold";
                }
            });

            const feedback = document.getElementById('feedback-banner');
            feedback.classList.remove('hidden');
            if (isCorrect) {
                currentEarnedPoints += q.points;
                currentRawCorrect++;
                feedback.className = "p-3 rounded-lg text-xs font-bold text-center bg-green-100 text-green-800 border border-green-300";
                feedback.innerText = `Correct! (+${q.points} pts)`;
            } else {
                feedback.className = "p-3 rounded-lg text-xs font-bold text-center bg-red-100 text-red-800 border border-red-300";
                feedback.innerText = `Incorrect. Correct answer is ${q.answer} (+0 pts).`;
            }

            document.getElementById('score-text').innerText = `Points: ${currentEarnedPoints} / ${currentTotalPossiblePoints} pts`;

            const btn = document.getElementById('action-btn');
            if (currentIndex < activeQuestions.length - 1) {
                btn.innerText = "Next Question →";
                btn.onclick = goToNextQuestion;
            } else {
                btn.innerText = "Finish Practice Set";
                btn.onclick = finishSet;
            }
        }

        function goToNextQuestion() {
            currentIndex++;
            renderCurrentQuestion();
        }

        // function finishSet() {
        //     alert(`Practice Set Finished!\nWeighted Score: ${currentEarnedPoints} / ${currentTotalPossiblePoints} pts\nRaw Score: ${currentRawCorrect} / ${activeQuestions.length}`);
        //     renderSeriesSelector();
        // }
        function finishSet() {
            const currentSeriesNum = activeQuestions[0] ? activeQuestions[0].series : 1;
            const clbInfo = getCLBLevel(currentEarnedPoints, currentModule);

            // Save to cloud
            saveTestResult(currentSeriesNum, currentEarnedPoints);

            alert(`Practice Set Finished!\n\nSérie: ${currentSeriesNum}\nScore: ${currentEarnedPoints} / ${currentTotalPossiblePoints} pts\nNCLC/CLB Level: ${clbInfo.clb} (${clbInfo.cefr})`);
            renderSeriesSelector();
        }
        // Initialize App
        loadJSONData('ecrit');
    </script>
</body>
