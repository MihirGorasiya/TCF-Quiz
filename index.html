<!DOCTYPE html>
<html lang="fr" class="dark">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <style>
  html {
    touch-action: manipulation;
  }
</style>
    <title>TCF Prep Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                        darkBorder: '#334155'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 min-h-screen text-slate-100 p-4 lg:p-8 pb-12 transition-colors duration-200">
    <div class="max-w-md md:max-w-3xl lg:max-w-6xl mx-auto space-y-6">
        
        <!-- App Header -->
        <header class="bg-slate-900 border border-slate-800 p-5 lg:p-6 rounded-2xl shadow-lg text-center">
            <h1 class="text-xl md:text-2xl lg:text-3xl font-extrabold text-blue-400 tracking-tight">TEF / TCF Prep Hub</h1>
            <p class="text-xs md:text-sm text-slate-400 mt-1 font-medium">Weighted TEF Scoring & Cloud Performance Tracking</p>
        </header>

        <!-- Module & Mode Selection Controls -->
        <div class="bg-slate-900 border border-slate-800 p-5 lg:p-6 rounded-2xl shadow-lg space-y-4">
            <!-- Module Switcher -->
            <div class="flex bg-slate-950 p-1.5 rounded-xl border border-slate-800 max-w-xl mx-auto">
                <button id="mod-ecrit" onclick="switchModule('ecrit')" class="flex-1 py-2 text-xs md:text-sm font-bold rounded-lg bg-blue-600 text-white shadow transition">
                    Compréhension Écrite
                </button>
                <button id="mod-orale" onclick="switchModule('orale')" class="flex-1 py-2 text-xs md:text-sm font-bold rounded-lg text-slate-400 hover:text-slate-100 transition">
                    Compréhension Orale
                </button>
            </div>

            <!-- Set Selectors -->
            <div class="grid grid-cols-2 gap-3 max-w-xl mx-auto">
                <button onclick="renderSeriesSelector()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 py-2.5 rounded-xl text-xs md:text-sm font-semibold transition shadow-sm">
                    Series Sets (1–40)
                </button>
                <button onclick="loadWeakSpots()" class="bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-xs md:text-sm font-semibold transition shadow-sm">
                    Weak Spots Set
                </button>
            </div>
            <button onclick="resetStats()" class="block w-full text-center text-xs text-slate-500 hover:text-red-400 underline pt-1 transition">
                Reset Cloud Performance History
            </button>
        </div>

        <!-- Series Grid Selector & History Dashboard Container -->
        <div id="series-container" class="bg-slate-900 border border-slate-800 p-5 lg:p-6 rounded-2xl shadow-lg space-y-6">
            <!-- Top: Series Grid -->
            <div>
                <h2 id="series-grid-title" class="text-base font-bold mb-3 text-slate-200">Select Series</h2>
                <div id="series-grid" class="grid grid-cols-5 lg:grid-cols-8 gap-2.5"></div>
            </div>

            <!-- Bottom: Test History Section -->
            <div class="border-t pt-5 border-slate-800">
                <h2 class="text-base font-bold mb-3 text-slate-200 flex justify-between items-center">
                    <span>Test History</span>
                    <span id="history-module-badge" class="text-xs bg-blue-950 text-blue-300 border border-blue-800 px-2.5 py-0.5 rounded-full font-bold">Écrite</span>
                </h2>
                <div id="history-list" class="space-y-2.5 max-h-96 overflow-y-auto pr-1 text-xs md:text-sm">
                    <p class="text-slate-500 italic text-center py-6">Loading history...</p>
                </div>
            </div>
        </div>

        <!-- Active Question Card -->
        <div id="quiz-container" class="hidden max-w-2xl lg:max-w-3xl mx-auto space-y-4">
            <!-- Progress & Badge Header -->
            <div class="flex justify-between items-center bg-slate-900 border border-slate-800 px-5 py-3 rounded-2xl shadow-lg text-xs md:text-sm font-semibold">
                <span id="progress-text" class="text-slate-400">Question 1 / 39</span>
                <span id="score-text" class="text-blue-400 font-bold">Points: 0 / 0</span>
            </div>

            <!-- Single Question Container -->
            <div id="question-card" class="bg-slate-900 border border-slate-800 p-5 lg:p-8 rounded-2xl shadow-lg space-y-4">
                <p id="q-info" class="text-xs md:text-sm bg-slate-950 border border-slate-800 p-3.5 rounded-xl italic text-slate-300 leading-relaxed"></p>
                
                <div id="audio-container" class="hidden">
                    <audio id="q-audio" controls class="w-full mt-2"></audio>
                </div>

                <div class="flex justify-between items-start gap-4">
                    <p id="q-text" class="font-semibold text-sm md:text-base text-slate-100 leading-snug"></p>
                    <span id="q-points-badge" class="bg-blue-950 text-blue-300 border border-blue-800 text-xs font-bold px-2.5 py-1 rounded-full shrink-0"></span>
                </div>

                <div id="options-container" class="space-y-2.5 pt-2"></div>

                <!-- Action Button -->
                <button id="action-btn" onclick="submitAnswer()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3.5 rounded-xl font-bold shadow-md text-sm md:text-base transition">
                    Submit Answer
                </button>

                <!-- Feedback Banner (Under the Submit Button) -->
                <div id="feedback-banner" class="hidden p-3.5 rounded-xl text-xs md:text-sm font-bold text-center"></div>
            </div>
        </div>

    </div>

    <script>
        // =================================-------------------------
        // 1. SUPABASE CONFIGURATION
        // =================================-------------------------
        const SUPABASE_URL = "https://cheyvjepgywypvzzkoio.supabase.co";
        const SUPABASE_KEY = "sb_publishable_EgZFYyBbZSKJoFR2K02FYg_7nzSub4v";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let database = { ecrit: [], orale: [] };
        let currentModule = 'ecrit'; 
        let activeQuestions = [];
        let currentIndex = 0;
        let currentEarnedPoints = 0;
        let currentTotalPossiblePoints = 0;
        let currentRawCorrect = 0;

        const JSON_PATHS = {
            ecrit: './questions.json',
            orale: './listening.json'
        };

        // TEF/TCF Points Breakdown Helper
        function getQuestionPoints(qNumber) {
            const num = parseInt(qNumber, 10);
            if (num >= 1 && num <= 4) return 3;
            if (num >= 5 && num <= 10) return 9;
            if (num >= 11 && num <= 19) return 15;
            if (num >= 20 && num <= 29) return 21;
            if (num >= 30 && num <= 35) return 26;
            if (num >= 36 && num <= 39) return 33;
            return 15;
        }

        // NCLC / CLB Mapping Logic
        function getCLBLevel(score, moduleType) {
            const isReading = (moduleType === 'ecrit');
            
            if (isReading) {
                if (score >= 549) return { clb: 10, cefr: "C1-C2" };
                if (score >= 524) return { clb: 9, cefr: "C1" };
                if (score >= 499) return { clb: 8, cefr: "B2" };
                if (score >= 453) return { clb: 7, cefr: "B2" };
                if (score >= 406) return { clb: 6, cefr: "B1" };
                if (score >= 375) return { clb: 5, cefr: "B1" };
                if (score >= 342) return { clb: 4, cefr: "A2" };
                return { clb: "<4", cefr: "A1-A2" };
            } else { 
                if (score >= 549) return { clb: 10, cefr: "C1-C2" };
                if (score >= 523) return { clb: 9, cefr: "C1" };
                if (score >= 503) return { clb: 8, cefr: "B2" };
                if (score >= 458) return { clb: 7, cefr: "B2" };
                if (score >= 398) return { clb: 6, cefr: "B1" };
                if (score >= 369) return { clb: 5, cefr: "B1" };
                if (score >= 331) return { clb: 4, cefr: "A2" };
                return { clb: "<4", cefr: "A1-A2" };
            }
        }

        // =================================-------------------------
        // 2. FETCH JSON & MAP QUESTIONS
        // =================================-------------------------
        async function loadJSONData(moduleType) {
            const filePath = JSON_PATHS[moduleType];
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`Could not load ${filePath}`);
                
                const data = await response.json();
                const rawArray = data.questions || data;

                database[moduleType] = rawArray.map((q, index) => {
                    const seriesIndex = Math.floor(index / 39) + 1;
                    const posInSeries = (index % 39) + 1;
                    return {
                        id: `${moduleType.charAt(0).toUpperCase()}_${q.number || (index + 1)}`,
                        series: seriesIndex,
                        posInSeries: posInSeries,
                        points: getQuestionPoints(posInSeries),
                        info: q.info || "",
                        audio: q.audio || null,
                        question: q.question,
                        options: q.options,
                        answer: q.answer
                    };
                });

                renderSeriesSelector();
            } catch (error) {
                console.error("Error loading JSON:", error);
                document.getElementById('series-grid').innerHTML = `
                    <div class="col-span-5 text-red-400 text-xs text-center p-4">
                        <b>File Load Error:</b><br>${error.message}
                    </div>
                `;
            }
        }

        // =================================-------------------------
        // 3. CLOUD SYNC FUNCTIONS (SUPABASE - UNIQUE UPSERT)
        // =================================-------------------------
        async function saveAttemptToCloud(questionId, isCorrect, submittedAnswer) {
            // First check if a record already exists to aggregate attempts
            const { data: existing } = await _supabase
                .from('attempts')
                .select('*')
                .eq('question_id', questionId)
                .eq('module', currentModule)
                .maybeSingle();

            const total = (existing?.total_attempts || 0) + 1;
            const wrong = (existing?.wrong_attempts || 0) + (isCorrect ? 0 : 1);

            // Upsert: updates if (question_id, module) exists, inserts if not
            const { error } = await _supabase
                .from('attempts')
                .upsert({
                    question_id: questionId,
                    module: currentModule,
                    is_correct: isCorrect,
                    last_answer: submittedAnswer,
                    total_attempts: total,
                    wrong_attempts: wrong
                }, { 
                    onConflict: 'question_id,module' 
                });

            if (error) {
                console.error("Error updating attempt:", error);
            }
        }

        async function saveTestResult(seriesNum, score) {
            const { clb, cefr } = getCLBLevel(score, currentModule);
            
            await _supabase.from('test_results').insert([{
                module: currentModule,
                series_number: seriesNum,
                score: score,
                clb_level: typeof clb === 'number' ? clb : 0,
                cefr_level: cefr
            }]);

            loadTestHistory();
        }

        async function loadTestHistory() {
            const historyList = document.getElementById('history-list');
            document.getElementById('history-module-badge').innerText = currentModule === 'ecrit' ? 'Écrite' : 'Orale';

            const { data: results, error } = await _supabase
                .from('test_results')
                .select('*')
                .eq('module', currentModule)
                .order('created_at', { ascending: false });

            if (error || !results || results.length === 0) {
                historyList.innerHTML = `<p class="text-slate-500 italic text-center py-6">No completed tests yet for ${currentModule === 'ecrit' ? 'Écrite' : 'Orale'}.</p>`;
                return;
            }

            historyList.innerHTML = '';
            results.forEach(res => {
                const dateStr = new Date(res.created_at).toLocaleDateString('fr-FR', { month: 'short', day: 'numeric' });
                const clbInfo = getCLBLevel(res.score, res.module);

                const card = document.createElement('div');
                card.className = "flex justify-between items-center p-3 bg-slate-950 border border-slate-800 rounded-xl hover:border-slate-700 transition";
                card.innerHTML = `
                    <div>
                        <p class="font-bold text-slate-200">Série ${res.series_number}</p>
                        <p class="text-[10px] text-slate-500">${dateStr}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-extrabold text-blue-400">${res.score} pts</p>
                        <span class="text-[10px] bg-purple-950 text-purple-300 border border-purple-800 font-bold px-2 py-0.5 rounded">
                            CLB ${clbInfo.clb} (${clbInfo.cefr})
                        </span>
                    </div>
                `;
                historyList.appendChild(card);
            });
        }

        async function loadWeakSpots() {
            const { data: attempts, error } = await _supabase
                .from('attempts')
                .select('*')
                .eq('module', currentModule);

            if (error || !attempts || attempts.length === 0) {
                alert("No performance history found in Supabase! Answer some questions first.");
                return;
            }

            // Identify questions where failure rate is >= 50% or the last attempt was incorrect
            const weakQuestionIds = new Set(
                attempts.filter(a => {
                    if (a.total_attempts) {
                        return (a.wrong_attempts / a.total_attempts) >= 0.5;
                    }
                    return !a.is_correct;
                }).map(a => a.question_id)
            );

            const moduleQuestions = database[currentModule] || [];
            const rawWeakSpots = moduleQuestions.filter(q => weakQuestionIds.has(q.id));

            // Deduplicate by question text
            const seenTexts = new Set();
            activeQuestions = rawWeakSpots.filter(q => {
                const cleanText = q.question.trim().toLowerCase();
                if (seenTexts.has(cleanText)) return false;
                seenTexts.add(cleanText);
                return true;
            });

            if (activeQuestions.length === 0) {
                alert("No weak spots identified! All answered questions are performing well.");
                return;
            }

            startQuiz();
        }

        async function resetStats() {
            if (confirm("Are you sure you want to clear your entire cloud performance history?")) {
                await _supabase.from('attempts').delete().eq('module', currentModule);
                await _supabase.from('test_results').delete().eq('module', currentModule);
                alert("Cloud history reset!");
                loadTestHistory();
            }
        }

        // =================================-------------------------
        // 4. NAVIGATION & RENDERING CONTROLS
        // =================================-------------------------
        function switchModule(moduleType) {
            currentModule = moduleType;
            
            const btnEcrit = document.getElementById('mod-ecrit');
            const btnOrale = document.getElementById('mod-orale');

            if (moduleType === 'ecrit') {
                btnEcrit.className = "flex-1 py-2 text-xs md:text-sm font-bold rounded-lg bg-blue-600 text-white shadow transition";
                btnOrale.className = "flex-1 py-2 text-xs md:text-sm font-bold rounded-lg text-slate-400 hover:text-slate-100 transition";
            } else {
                btnOrale.className = "flex-1 py-2 text-xs md:text-sm font-bold rounded-lg bg-blue-600 text-white shadow transition";
                btnEcrit.className = "flex-1 py-2 text-xs md:text-sm font-bold rounded-lg text-slate-400 hover:text-slate-100 transition";
            }

            if (database[currentModule].length === 0) {
                loadJSONData(currentModule);
            } else {
                renderSeriesSelector();
            }
        }

        function renderSeriesSelector() {
            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('series-container').classList.remove('hidden');

            const title = document.getElementById('series-grid-title');
            title.innerText = `Select ${currentModule === 'ecrit' ? 'Compréhension Écrite' : 'Compréhension Orale'} Series`;

            const grid = document.getElementById('series-grid');
            grid.innerHTML = '';

            const moduleQuestions = database[currentModule] || [];
            const totalSeries = moduleQuestions.length > 0 
                ? Math.max(...moduleQuestions.map(q => q.series)) 
                : 40;

            for (let i = 1; i <= totalSeries; i++) {
                const btn = document.createElement('button');
                btn.className = "bg-slate-800/80 text-blue-400 hover:text-white font-bold p-3 md:p-4 rounded-xl text-center hover:bg-blue-600 border border-slate-700/80 hover:border-blue-500 transition text-sm md:text-base shadow-sm";
                btn.innerText = i;
                btn.onclick = () => loadSeries(i);
                grid.appendChild(btn);
            }

            loadTestHistory();
        }

        function loadSeries(seriesNum) {
            const moduleQuestions = database[currentModule] || [];
            activeQuestions = moduleQuestions.filter(q => q.series === seriesNum);

            if (activeQuestions.length === 0) {
                alert(`No questions found in Series ${seriesNum} for this module.`);
                return;
            }

            startQuiz();
        }

        function startQuiz() {
            currentIndex = 0;
            currentEarnedPoints = 0;
            currentRawCorrect = 0;
            currentTotalPossiblePoints = activeQuestions.reduce((sum, q) => sum + q.points, 0);

            document.getElementById('series-container').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            const q = activeQuestions[currentIndex];

            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} / ${activeQuestions.length}`;
            document.getElementById('score-text').innerText = `Points: ${currentEarnedPoints} / ${currentTotalPossiblePoints} pts`;

            const infoElem = document.getElementById('q-info');
            if (q.info) {
                infoElem.innerText = q.info;
                infoElem.classList.remove('hidden');
            } else {
                infoElem.classList.add('hidden');
            }

            const audioContainer = document.getElementById('audio-container');
            const audioElem = document.getElementById('q-audio');
            if (q.audio) {
                audioElem.src = q.audio;
                audioContainer.classList.remove('hidden');
            } else {
                audioContainer.classList.add('hidden');
            }

            document.getElementById('q-text').innerText = q.question;
            document.getElementById('q-points-badge').innerText = `+${q.points} pt`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            ['A', 'B', 'C', 'D'].forEach(optKey => {
                if (q.options && q.options[optKey]) {
                    const label = document.createElement('label');
                    label.id = `opt-label-${optKey}`;
                    label.className = "flex items-center space-x-3 text-xs md:text-sm p-3.5 rounded-xl border border-slate-700 bg-slate-950/70 hover:bg-slate-800 text-slate-200 cursor-pointer transition";
                    label.innerHTML = `
                        <input type="radio" name="option" value="${optKey}" class="text-blue-500 bg-slate-900 border-slate-700 focus:ring-0">
                        <span id="opt-text-${optKey}"><b>${optKey}:</b> ${q.options[optKey]}</span>
                    `;
                    optionsContainer.appendChild(label);
                }
            });

            const feedback = document.getElementById('feedback-banner');
            feedback.className = "hidden p-3.5 rounded-xl text-xs md:text-sm font-bold text-center";
            
            const btn = document.getElementById('action-btn');
            btn.innerText = "Submit Answer";
            btn.onclick = submitAnswer;
        }

        async function submitAnswer() {
            const selectedOpt = document.querySelector('input[name="option"]:checked');
            if (!selectedOpt) {
                alert("Please select an answer first!");
                return;
            }

            const q = activeQuestions[currentIndex];
            const userAns = selectedOpt.value;
            const isCorrect = (userAns === q.answer);

            // Saves/updates answer uniquely in cloud
            await saveAttemptToCloud(q.id, isCorrect, userAns);

            ['A', 'B', 'C', 'D'].forEach(key => {
                const label = document.getElementById(`opt-label-${key}`);
                if (!label) return;
                
                const radio = label.querySelector('input');
                radio.disabled = true;

                if (key === q.answer) {
                    label.className = "flex items-center space-x-3 text-xs md:text-sm p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-950/60 text-emerald-200 font-semibold shadow";
                } else if (key === userAns && !isCorrect) {
                    label.className = "flex items-center space-x-3 text-xs md:text-sm p-3.5 rounded-xl border-2 border-rose-500 bg-rose-950/60 text-rose-200 font-semibold shadow";
                }
            });

            const feedback = document.getElementById('feedback-banner');
            feedback.classList.remove('hidden');
            if (isCorrect) {
                currentEarnedPoints += q.points;
                currentRawCorrect++;
                feedback.className = "p-3.5 rounded-xl text-xs md:text-sm font-bold text-center bg-emerald-950/80 text-emerald-300 border border-emerald-700 shadow-md";
                feedback.innerText = `Excellente réponse ! (+${q.points} pts)`;
            } else {
                feedback.className = "p-3.5 rounded-xl text-xs md:text-sm font-bold text-center bg-rose-950/80 text-rose-300 border border-rose-700 shadow-md";
                feedback.innerText = `Mauvaise réponse. La bonne réponse est l'option ${q.answer}.`;
            }

            document.getElementById('score-text').innerText = `Points: ${currentEarnedPoints} / ${currentTotalPossiblePoints} pts`;

            const btn = document.getElementById('action-btn');
            if (currentIndex < activeQuestions.length - 1) {
                btn.innerText = "Next Question →";
                btn.onclick = goToNextQuestion;
            } else {
                btn.innerText = "Finish Practice Set";
                btn.onclick = finishSet;
            }
        }

        function goToNextQuestion() {
            currentIndex++;
            renderCurrentQuestion();
        }

        function finishSet() {
            const currentSeriesNum = activeQuestions[0] ? activeQuestions[0].series : 1;
            const clbInfo = getCLBLevel(currentEarnedPoints, currentModule);
            
            saveTestResult(currentSeriesNum, currentEarnedPoints);

            alert(`Practice Set Finished!\n\nSérie: ${currentSeriesNum}\nScore: ${currentEarnedPoints} / ${currentTotalPossiblePoints} pts\nNCLC / CLB Level: ${clbInfo.clb} (${clbInfo.cefr})`);
            renderSeriesSelector();
        }

        // Initialize App
        loadJSONData('ecrit');
    </script>
</body>
</html>
